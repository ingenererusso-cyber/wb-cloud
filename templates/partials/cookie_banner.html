<style>
    .cookie-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 1200;
        display: none;
        justify-content: center;
    }

    .cookie-banner.is-visible {
        display: flex;
    }

    .cookie-banner-card {
        width: min(760px, 100%);
        border: 1px solid rgba(19, 32, 51, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 42px rgba(19, 32, 51, 0.16);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
    }

    .cookie-banner-text {
        margin: 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.5;
    }

    .cookie-banner-text a {
        color: #14532d;
        font-weight: 700;
        text-decoration: none;
    }

    .cookie-banner-btn {
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #14532d 0%, #065f46 100%);
        color: #fff;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(20, 83, 45, 0.2);
    }

    @media (max-width: 720px) {
        .cookie-banner {
            left: 12px;
            right: 12px;
            bottom: 12px;
        }

        .cookie-banner-card {
            padding: 12px 14px;
        }
    }
</style>
<div class="cookie-banner" id="cookie-banner" aria-live="polite">
    <div class="cookie-banner-card">
        <p class="cookie-banner-text">
            Сайт использует технические cookies, необходимые для работы личного кабинета.
            Подробнее в <a href="{% url 'legal_privacy' %}">Политике обработки персональных данных</a>.
        </p>
        <button type="button" class="cookie-banner-btn" id="cookie-banner-accept">Понятно</button>
    </div>
</div>
<script>
    (function () {
        const banner = document.getElementById("cookie-banner");
        const acceptBtn = document.getElementById("cookie-banner-accept");
        if (!banner || !acceptBtn) return;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(";").shift();
            }
            return "";
        }

        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 86400000).toUTCString();
            document.cookie = `${name}=${value}; expires=${expires}; path=/; SameSite=Lax`;
        }

        if (getCookie("cookie_notice_v1") !== "1") {
            banner.classList.add("is-visible");
        }

        acceptBtn.addEventListener("click", () => {
            setCookie("cookie_notice_v1", "1", 180);
            banner.classList.remove("is-visible");
        });
    })();
</script>
